<div class="login-page">

  <div class="background-glow background-glow-red"></div>
  <div class="background-glow background-glow-blue"></div>

  <main class="login-container">

    <!-- SECCIÓN DE IDENTIDAD -->
    <section class="brand-panel">

      <div class="brand-content">

        <img
          src="assets/branding/logo-40fc.png"
          alt="Escudo 40 FC"
          class="brand-logo"
        >

        <div class="brand-text">
          <span class="brand-kicker">CLUB DEPORTIVO</span>

          <h1>40 FC</h1>

          <p>
            Gestión administrativa y financiera del club
          </p>
        </div>

      </div>

      <div class="brand-footer">
        <span></span>
        <p>Pasión · Compromiso · Equipo</p>
      </div>

    </section>


    <!-- FORMULARIO -->
    <section class="login-panel">

      <div class="login-card">

        <div class="mobile-logo">
          <img
            src="assets/branding/logo-40fc.png"
            alt="Escudo 40 FC"
          >
        </div>

        <header class="login-header">

          <span class="login-label">
            ACCESO 40 FC
          </span>

          <h2>Bienvenido</h2>

          <p>
            Ingresa tus credenciales para acceder a tu cuenta.
          </p>

        </header>


        <form class="login-form">

          <div class="form-group">

            <label for="email">
              Correo electrónico
            </label>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="usuario@40fc.com"
              autocomplete="email"
            >

          </div>


          <div class="form-group">

            <label for="password">
              Contraseña
            </label>

            <input
              id="password"
              name="password"
              type="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
            >

          </div>


          <button
            type="submit"
            class="login-button"
          >
            INICIAR SESIÓN
          </button>

        </form>


        <div class="login-help">

          <span class="status-dot"></span>

          <p>
            Acceso exclusivo para miembros de 40 FC
          </p>

        </div>

      </div>

    </section>

  </main>

</div>
