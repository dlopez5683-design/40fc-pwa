<div class="app-shell">

  <!-- MENÚ LATERAL -->
  <aside class="sidebar">

    <div class="sidebar-brand">

      <img
        src="assets/branding/logo-40fc.png"
        alt="Escudo 40 FC"
      >

      <div>
        <strong>40 FC</strong>
        <span>Miembro del club</span>
      </div>

    </div>


    <nav class="sidebar-nav">

      <a
  routerLink="/jugador"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }"
  class="nav-item"
>
  <span class="nav-icon">⌂</span>
  <span>Inicio</span>
</a>

<a
  routerLink="/jugador/fondo"
  routerLinkActive="active"
  class="nav-item"
>
  <span class="nav-icon">$</span>
  <span>Mi fondo</span>
</a>

      

      <a
  routerLink="/jugador/partidos"
  routerLinkActive="active"
  class="nav-item"
>
  <span class="nav-icon">⚽</span>
  <span>Partidos</span>
</a>

      <a
        href="#"
        class="nav-item"
      >
        <span class="nav-icon">◇</span>
        <span>Actividades</span>
      </a>

      <a
        href="#"
        class="nav-item"
      >
        <span class="nav-icon">○</span>
        <span>Mi perfil</span>
      </a>

    </nav>


    <div class="sidebar-footer">

      <a
        routerLink="/login"
        class="logout"
      >
        Cerrar sesión
      </a>

    </div>

  </aside>


  <!-- CONTENIDO -->
  <section class="main-area">

    <header class="topbar">

      <div class="topbar-brand">

  <img
    src="assets/branding/logo-40fc.png"
    alt="40 FC"
    class="topbar-logo"
  >

  <div>

    <span class="topbar-label">
      PANEL DEL JUGADOR
    </span>

    <h1>40 FC</h1>

  </div>

</div>


      <div class="user-info">

        <div class="user-text">
          <strong>Carlos Pérez</strong>
          <span>Jugador</span>
        </div>

        <div class="avatar">
          CP
        </div>

      </div>

    </header>


    <main class="content">

      <router-outlet></router-outlet>

    </main>

  </section>

  <nav class="mobile-nav">

  <a
  routerLink="/jugador"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }"
  class="mobile-nav-item"
>
  <span class="mobile-nav-icon">⌂</span>
  <span>Inicio</span>
</a>

<a
  routerLink="/jugador/fondo"
  routerLinkActive="active"
  class="mobile-nav-item"
>
  <span class="mobile-nav-icon">$</span>
  <span>Fondo</span>
</a>

  <a
  routerLink="/jugador/partidos"
  routerLinkActive="active"
  class="mobile-nav-item"
>
  <span class="mobile-nav-icon">⚽</span>
  <span>Partidos</span>
</a>

  <a
    href="#"
    class="mobile-nav-item"
  >
    <span class="mobile-nav-icon">◇</span>
    <span>Actividades</span>
  </a>

  <a
    href="#"
    class="mobile-nav-item"
  >
    <span class="mobile-nav-icon">○</span>
    <span>Perfil</span>
  </a>

</nav>

</div>
